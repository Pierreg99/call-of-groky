<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Call of Groky</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <div id="hud">
        <div id="crosshair"></div>
        <div id="hitmarker"></div>
        <div id="vignette"></div>
        <div id="top-bar">
          <div id="health-wrap">
            <span class="label">HP</span>
            <div id="health-bar"><div id="health-fill"></div></div>
            <span id="health-text">100</span>
          </div>
          <div id="objective">
            <div class="obj-bar"><div id="objective-fill"></div></div>
            <span class="obj-text">SECURE TOWER · ELIMINATE 0/10</span>
          </div>
        </div>
        <div id="compass">
          <div id="compass-ring">
            <div id="compass-needle"></div>
            <div id="compass-n">N</div>
          </div>
          <div id="compass-label">OBJ</div>
        </div>
        <div id="minimap" aria-hidden="true">
          <canvas id="minimap-canvas" width="128" height="128"></canvas>
          <div id="minimap-label">RADAR</div>
        </div>
        <div id="dmg-layer"></div>
        <div id="streak-toast" aria-hidden="true"></div>
        <div id="bottom-bar">
          <div id="weapon-slots">
            <div id="slot-1" class="wep-slot active"><span class="n">1</span><span class="nm">G-16</span></div>
            <div id="slot-2" class="wep-slot"><span class="n">2</span><span class="nm">G-9</span></div>
          </div>
          <div id="ammo">
            <span id="ammo-mag">30</span>
            <span class="sep">/</span>
            <span id="ammo-reserve">90</span>
            <span id="weapon-name">GROKY-16</span>
          </div>
        </div>
        <div id="kill-feed"></div>
        <div id="pickup-toast" aria-hidden="true"></div>
        <div id="killcam" aria-hidden="true">
          <div class="kc-label">ELIMINATED</div>
          <div id="killcam-name">TARGET</div>
        </div>
        <div id="fps-counter" style="display:none">FPS --</div>
        <div id="overlay" class="visible">
          <div class="panel">
            <h1>CALL OF <span>GROKY</span></h1>
            <p class="tag">LOOP 7 — MINIMAP · WAVES · JUICE · SMG LAYER</p>
            <p class="hint">Click to lock · WASD · Shift sprint · Ctrl crouch · Space jump · LMB fire · RMB ADS · R reload · 1/2 or scroll switch · F3 FPS</p>
            <button id="start-btn" type="button">DEPLOY</button>
          </div>
        </div>
        <div id="damage-flash"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
